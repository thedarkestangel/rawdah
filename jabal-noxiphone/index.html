 radial-gradient(circle at 0 0,rgba(231,194,107,.5) 0 2px,transparent 3px) 0 0/100% 100% no-repeat}

/* ---------- ark ---------- */
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:90%;z-index:9;background:linear-gradient(rgba(18,15,44,.97),rgba(10,8,28,.98));border-top:1px solid rgba(231,194,107,.4);border-radius:24px 24px 0 0;padding:16px 16px calc(var(--safe-b) + 18px);overflow-y:auto;transform:translateY(105%);transition:transform .45s cubic-bezier(.2,.8,.2,1);-webkit-user-select:text;user-select:text}

code{background:rgba(255,255,255,.08);padding:1px 5px;border-radius:5px;font-size:12.5px;word-break:break-all}
.btn{display:block;width:100%;min-height:48px;border-radius:14px;background:var(--gold);color:#2a1a06;font-weight:700;margin-top:10px}

/* ---------- INTRO ---------- */
#prolog{position:fixed;inset:0;z-index:40;background:#03020c;opacity:0;transition:opacity .6s}#prolog.on{opacity:1}#prolog svg{position:absolute;inset:0;width:100%;height:100%}

@media (max-height:700px){#title .ta{font-size:50px}#title .tdua{margin-top:10px;padding:8px 12px}#title .tdua .da{font-size:17px}#title .tdua .dn{font-size:13.5px}#title .tdua .dt{display:none}}
#title .tb{position:absolute;left:24px;right:24px;bottom:calc(env(safe-area-inset-bottom,0px) + 7vh);text-align:center;animation:tUp 1.6s .4s ease both}
#title .tb .btn{display:block;margin:0 auto;width:100%;max-width:340px;font-size:16px;box-shadow:0 0 28px rgba(231,194,107,.35)}
#title .tb .tguide{display:block;margin:14px auto 0;background:none;border:0;color:#ffe6a6;font-size:14px;text-decoration:underline;text-underline-offset:4px;opacity:.9}

function sunTimes(d,lat=59.91,lng=10.75){
  const rad=Math.PI/180,noon=new Date(d.getFullYear(),d.getMonth(),d.getDate(),12),day=Math.round(noon.getTime()/864e5+2440587.5-2451545+.0008),Js=day-lng/360;

  const L=(M+C+180+102.9372)%360,Jt=2451545+Js+.0053*Math.sin(M*rad)-.0069*Math.sin(2*L*rad);
  const dec=Math.asin(Math.sin(L*rad)*Math.sin(23.44*rad));
  const cw=(Math.sin(-.83*rad)-Math.sin(lat*rad)*Math.sin(dec))/(Math.cos(lat*rad)*Math.cos(dec));
  const w=Math.acos(Math.max(-1,Math.min(1,cw)))/rad/360,toD=j=>new Date((j-2440587.5)*864e5);
  return {rise:toD(Jt-w),set:toD(Jt+w)};
}

function cyp(x,b,h,w,cls='sil'){

  const seed=Math.abs(Math.sin(x*12.9898+h*78.233))*1e4, rnd=k=>{ const v=Math.sin(seed+k*91.7)*43758.5453; return v-Math.floor(v); };

  const prof=t=>w*Math.pow(Math.sin(Math.PI*Math.min(1,t*1.06)),.7)*(1-.3*t);
  const ys=Array.from({length:N+1},(_,i)=>base-(h*.95)*(i/N));
  let d=`M${f(x-w*.15)} ${f(base)} `;
  for(let i=0;i<N;i++){ const y0=ys[i],y1=ys[i+1],t=(i+.5)/N, bw=prof(t)*(1+(rnd(i)-.5)*.18); d+=`C${f(x-bw*1.12)} ${f(y0)} ${f(x-bw*1.12)} ${f(y1)} ${f(x-prof((i+1)/N)*.7)} ${f(y1)} `; }
  d+=`Q${f(x-w*.05)} ${f(b-h-2)} ${f(x)} ${f(b-h)} Q${f(x+w*.05)} ${f(b-h-2)} ${f(x+prof(1-1/N)*.7)} ${f(ys[N])} `;
  for(let i=N-1;i>=0;i--){ const y0=ys[i+1],y1=ys[i],t=(i+.5)/N, bw=prof(t)*(1+(rnd(i+30)-.5)*.18); d+=`C${f(x+bw*1.12)} ${f(y0)} ${f(x+bw*1.12)} ${f(y1)} ${f(i?x+prof(i/N)*.7:x+w*.15)} ${f(y1)} `; }
  d+='Z';
  let sh=`M${f(x+w*.05)} ${f(b-h+4)} `; for(let i=N-1;i>=0;i--){ const y0=ys[i+1],y1=ys[i],t=(i+.5)/N, bw=prof(t); sh+=`C${f(x+bw*1.1)} ${f(y0)} ${f(x+bw*1.1)} ${f(y1)} ${f(x+prof(i/N)*.65)} ${f(y1)} `; } sh+=`L${f(x+w*.12)} ${f(base)} Q${f(x+w*.35)} ${f(b-h*.5)} ${f(x+w*.05)} ${f(b-h+4)}Z`;
  const lit=h>30?Array.from({length:N-1},(_,i)=>{ const y=(ys[i]+ys[i+1])/2, bw=prof((i+.5)/N); return `<path d="M${f(x-bw*.85)} ${f(y+ (ys[i]-ys[i+1])*.25)} Q${f(x-bw*.95)} ${f(y)} ${f(x-bw*.45)} ${f(y-(ys[i]-ys[i+1])*.3)}" fill="none" stroke="rgba(255,236,190,.22)" stroke-width="${f(Math.max(.8,w*.14))}" stroke-linecap="round"/>`; }).join(''):'';
  return `<g><path d="M${f(x-w*.08)} ${b} V${f(base-2)} H${f(x+w*.08)} V${b}Z" fill="#3a2414"/><path class="${cls}" d="${d}"/><path d="${sh}" fill="rgba(10,6,30,.28)"/>${lit}</g>`; }

const PICK_SLOTS=()=>SLOTS.map((s,i)=>i).filter(i=>SLOTS[i].y>470&&SLOTS[i].y<630);
function produce(day){ const F=S.flock, add=(type,n)=>{ for(let i=0;i<n&&S.picks.length<14;i++){ const used=new Set(S.picks.map(p=>p.s)); const pool=PICK_SLOTS().filter(i=>!used.has(i)); if(!pool.length) return; S.picks.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),type,s:rnd(pool),day}); } };
  add('ull',Math.ceil(F.sheep/2)); add('melk',F.cows+F.goats); add('egg',kornOK()?F.hens:0); }
function pickSvg(p){ const sl=SLOTS[p.s]; if(!sl) return ''; const x=sl.x, y=sl.y, s=sl.sc; let g='';
  if(p.type==='ull') g=`<circle cx="${x-4*s}" cy="${y-4*s}" r="${5*s}" fill="#fbf5e8" stroke="#1a1030" stroke-width="1.2"/><circle cx="${x+3*s}" cy="${y-6*s}" r="${5.5*s}" fill="#fbf5e8" stroke="#1a1030" stroke-width="1.2"/><circle cx="${x}" cy="${y-2*s}" r="${4.5*s}" fill="#fbf5e8"/>`;
  if(p.type==='melk') g=`<path d="M${x-7*s} ${y-14*s} h${14*s} l${-2*s} ${14*s} h${-10*s}Z" fill="#a8b4c4" stroke="#1a1030" stroke-width="1.2"/><ellipse cx="${x}" cy="${y-14*s}" rx="${7*s}" ry="${2.2*s}" fill="#fffdf6" stroke="#1a1030" stroke-width="1"/><path d="M${x-7*s} ${y-12*s} q${7*s} ${-12*s} ${14*s} 0" fill="none" stroke="#6a6074" stroke-width="1"/>`;
  if(p.type==='egg') g=`<ellipse cx="${x}" cy="${y-2*s}" rx="${9*s}" ry="${3.5*s}" fill="#b08a4a" stroke="#1a1030" stroke-width="1"/><ellipse cx="${x-3*s}" cy="${y-5*s}" rx="${3*s}" ry="${3.8*s}" fill="#fff6e4" stroke="#1a1030" stroke-width="1"/><ellipse cx="${x+3*s}" cy="${y-5*s}" rx="${3*s}" ry="${3.8*s}" fill="#f7e6c8" stroke="#1a1030" stroke-width="1"/>`;
  return `<g class="pick" data-p="${p.id}" style="cursor:pointer">${g}<rect x="${x-14*s}" y="${y-22*s}" width="${28*s}" height="${26*s}" fill="transparent"/></g>`; }
function collect(id,e){
  if(!canTend()) return toast('Du samler i «Stell»-delen, eller når økten er ferdig.');
  const p=S.picks.find(x=>x.id===id); if(!p) return; S.picks=S.picks.filter(x=>x!==p); S.goods[p.type]++; taskHit('samle'); snd.pop(); haptic(12);
  save(); renderSection(); say(e,p.type==='ull'?'– sauene':p.type==='egg'?'– hønene':'– kua'); toast(`+1 ${GOODS[p.type].name.toLowerCase()} · selg på markedet i basaren`,1800); }

/* ================= LYD (syntetisert, ingen filer) ================= */
const snd=(()=>{ let ctx=null, master=null, amb=null, noiseBuf=null, timers=[], started=false;
  const on=()=>S.settings.sound!==false;
  function ac(){ if(!ctx){ try{ ctx=new (window.AudioContext||window.webkitAudioContext)(); master=ctx.createGain(); master.gain.value=.9; master.connect(ctx.destination); }catch(e){ return null; } } if(ctx.state==='suspended') ctx.resume(); return ctx; }
  function noise(){ if(noiseBuf) return noiseBuf; const b=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate), d=b.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; return noiseBuf=b; }
  function env(g,t,a,peak,dec){ g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(peak,t+a); g.gain.exponentialRampToValueAtTime(.0001,t+a+dec); }
  function tone(f,t,dur,type='sine',vol=.12){ const o=ctx.createOscillator(), g=ctx.createGain(); o.type=type; o.frequency.value=f; o.connect(g); g.connect(master); env(g,t,.01,vol,dur); o.start(t); o.stop(t+dur+.05); return o; }
  function startAmb(){ if(started||!on()||!ac()) return; started=true;
    amb=ctx.createGain(); amb.gain.value=0; amb.connect(master); amb.gain.linearRampToValueAtTime(.5,ctx.currentTime+3);
    const src=ctx.createBufferSource(); src.buffer=noise(); src.loop=true; const bp=ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=700; bp.Q.value=.6;
    const wg=ctx.createGain(); wg.gain.value=.035; const lfo=ctx.createOscillator(), lg=ctx.createGain(); lfo.frequency.value=.25; lg.gain.value=.015; lfo.connect(lg); lg.connect(wg.gain); lfo.start();
    src.connect(bp); bp.connect(wg); wg.connect(amb); src.start();
    const tick=()=>{ if(!started) return; const t=ctx.currentTime, k=skyKey;
      if(k==='natt'||k==='maghrib'){ for(let i=0;i<3;i++){ const o=ctx.createOscillator(), g=ctx.createGain(); o.frequency.value=4300+Math.random()*300; o.connect(g); g.connect(amb); env(g,t+i*.09,.005,.012,.05); o.start(t+i*.09); o.stop(t+i*.09+.08); } }
      else if(Math.random()<.6){ const n=2+Math.floor(Math.random()*3), base=2400+Math.random()*1200; for(let i=0;i<n;i++){ const o=ctx.createOscillator(), g=ctx.createGain(), st=t+i*.16; o.frequency.setValueAtTime(base,st); o.frequency.exponentialRampToValueAtTime(base*1.35,st+.08); o.connect(g); g.connect(amb); env(g,st,.01,.02,.1); o.start(st); o.stop(st+.14); } }
      timers.push(setTimeout(tick,(skyKey==='natt'?1200:4000)+Math.random()*5000)); };
    tick(); duck(); }
  function stopAmb(){ started=false; timers.forEach(clearTimeout); timers=[]; if(amb){ try{ amb.gain.linearRampToValueAtTime(0,ctx.currentTime+.5); }catch(e){} } }
  function duck(){ if(amb&&ctx) amb.gain.linearRampToValueAtTime(S.active?.18:.5,ctx.currentTime+1); }
  const api={
    gesture(){ if(on()){ ac(); startAmb(); } },
    apply(){ if(on()){ ac(); startAmb(); } else stopAmb(); },
    duck,
    hoopoe(vol=.4){ if(!on()||!ac()) return; const t0=ctx.currentTime+.05;
      [0,1.25].forEach(rep=>[0,.3,.6].forEach(d=>{ const t=t0+rep+d, o=ctx.createOscillator(), o2=ctx.createOscillator(), g=ctx.createGain(), lp=ctx.createBiquadFilter();
        lp.type='lowpass'; lp.frequency.value=2200; o.type='sine'; o2.type='triangle';
        o.frequency.setValueAtTime(560,t); o.frequency.exponentialRampToValueAtTime(470,t+.17); o2.frequency.setValueAtTime(1120,t); o2.frequency.exponentialRampToValueAtTime(940,t+.17);
        o.connect(g); o2.connect(lp); lp.connect(g); g.connect(master); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.03); g.gain.exponentialRampToValueAtTime(.0001,t+.2);
        o.start(t); o2.start(t); o.stop(t+.25); o2.stop(t+.25); })); },
    chime(fs=[523,659,784],vol=.1){ if(!on()||!ac()) return; const t=ctx.currentTime; fs.forEach((f,i)=>{ tone(f,t+i*.11,1.2,'sine',vol); tone(f*2,t+i*.11,.6,'sine',vol*.25); }); },
    puff(){ if(!on()||!ac()) return; const t=ctx.currentTime, s=ctx.createBufferSource(), f=ctx.createBiquadFilter(), g=ctx.createGain(); s.buffer=noise(); f.type='lowpass'; f.frequency.value=900; s.connect(f); f.connect(g); g.connect(master); env(g,t,.01,.18,.25); s.start(t); s.stop(t+.4); },
    pop(){ if(!on()||!ac()) return; const t=ctx.currentTime, o=ctx.createOscillator(), g=ctx.createGain(); o.frequency.setValueAtTime(600,t); o.frequency.exponentialRampToValueAtTime(1200,t+.08); o.connect(g); g.connect(master); env(g,t,.005,.12,.12); o.start(t); o.stop(t+.2); },
    coin(){ if(!on()||!ac()) return; const t=ctx.currentTime; tone(988,t,.15,'triangle',.09); tone(1319,t+.08,.35,'triangle',.09); },
    moo(){ if(!on()||!ac()) return; const t=ctx.currentTime, o=ctx.createOscillator(), f=ctx.createBiquadFilter(), g=ctx.createGain(); o.type='sawtooth'; o.frequency.setValueAtTime(120,t); o.frequency.linearRampToValueAtTime(150,t+.25); o.frequency.linearRampToValueAtTime(110,t+.9); f.type='lowpass'; f.frequency.value=600; o.connect(f); f.connect(g); g.connect(master); env(g,t,.08,.12,.9); o.start(t); o.stop(t+1.1); },
    cluck(){ if(!on()||!ac()) return; const t=ctx.currentTime; [0,.12,.22].forEach(d=>{ const o=ctx.createOscillator(), g=ctx.createGain(); o.type='square'; o.frequency.setValueAtTime(900,t+d); o.frequency.exponentialRampToValueAtTime(500,t+d+.06); o.connect(g); g.connect(master); env(g,t+d,.004,.05,.07); o.start(t+d); o.stop(t+d+.1); }); },
    chirp(){ if(!on()||!ac()) return; const t=ctx.currentTime; [0,.1,.2].forEach(d=>{ const o=ctx.createOscillator(), g=ctx.createGain(); o.frequency.setValueAtTime(3000,t+d); o.frequency.exponentialRampToValueAtTime(4200,t+d+.06); o.connect(g); g.connect(master); env(g,t+d,.005,.05,.07); o.start(t+d); o.stop(t+d+.1); }); },
    splash(){ if(!on()||!ac()) return; const t=ctx.currentTime, s=ctx.createBufferSource(), f=ctx.createBiquadFilter(), g=ctx.createGain(); s.buffer=noise(); f.type='bandpass'; f.frequency.setValueAtTime(1800,t); f.frequency.exponentialRampToValueAtTime(500,t+.4); f.Q.value=1.2; s.connect(f); f.connect(g); g.connect(master); env(g,t,.01,.16,.45); s.start(t); s.stop(t+.6); },
    bleat(fr){ if(!on()||!ac()) return; const t=ctx.currentTime, o=ctx.createOscillator(), v=ctx.createOscillator(), vg=ctx.createGain(), f=ctx.createBiquadFilter(), g=ctx.createGain();
      o.type='sawtooth'; o.frequency.value=fr||330+Math.random()*80; v.frequency.value=7; vg.gain.value=18; v.connect(vg); vg.connect(o.frequency); f.type='bandpass'; f.frequency.value=1100; f.Q.value=2; o.connect(f); f.connect(g); g.connect(master); env(g,t,.04,.07,.45); o.start(t); v.start(t); o.stop(t+.55); v.stop(t+.55); },
  }; return api; })();

  people:[['Umm al-Darda den yngre (600-tallet)','Lærd i hadith og fiqh som underviste i moskeene i Damaskus og Jerusalem, også menn. En av de faste elevene hennes var kalifen Abd al-Malik.'],['Ibn al-Baytar (1197–1248)','Farmasøyt og botaniker fra Málaga som døde i Damaskus. Verket hans beskriver rundt 1400 planter, matvarer og legemidler, og han var sjefsherbalist for sultanen. Han testet legemidler selv i stedet for bare å stole på gamle bøker.'],['Al-Ghazali (1058–1111)','Lærd kalt Hujjat al-Islam, «Islams bevis». Han forlot den berømte lærestillingen sin i Bagdad og levde i tilbaketrekning i Damaskus. Ifølge tradisjonen feide han gulvene i Umayyade-moskeen uten at noen visste hvem han var. Det var i disse årene han skrev Ihya ulum al-din.']]},
 {id:'firdaws',name:'Madrasa al-Firdaws («Paradisskolen»)',city:'Aleppo',country:'Syria',lat:36.2,lon:37.2,built:'1235–1236',
  fact:'Skolen ble bygd og betalt av en kvinne, Dayfa Khatun, av hennes egne midler. Navnet betyr «paradiset». Den regnes som en av de vakreste madrasaene i Syria, og innskriftene på veggene er til sammen over 70 meter lange.',
  people:[['Dayfa Khatun (d. 1242)','Kurdisk prinsesse som styrte Aleppo som regent fra 1236 til 1242, mens barnebarnet var for ungt. Hun bygde både Paradisskolen og et sufisenter og støttet lærde.'],['Al-ʻIjliyya (900-tallet)','Hun laget astrolaber, instrumenter som måler stjernenes høyde, tid og retning, og arbeidet for emiren av Aleppo, Sayf al-Dawla. Hun kalles ofte Mariam, men det navnet står ikke i de gamle kildene. En asteroide, 7060 Al-ʻIjliya, er oppkalt etter henne.']]},
 {id:'aceh',name:'Baiturrahman-moskeen',city:'Banda Aceh',country:'Indonesia',lat:5.6,lon:95.3,built:'1879–1881',
  fact:'Den første moskeen her er knyttet til sultan Iskandar Muda i 1612. Den nåværende ble bygd av det nederlandske kolonistyret, og først nektet mange å be der. Under tsunamien i 2004 ble den stående mens området rundt ble ødelagt, og tusenvis søkte ly i den.',
  people:[['Malahayati (1500-tallet)','Indonesias nasjonalheltinne, kjent som en av verdens første kvinnelige admiraler. Ifølge fortellingen ledet hun Inong Balee, en flåte av krigsenker, og beseiret den nederlandske kapteinen Cornelis de Houtman i 1599. Samtidige kilder om henne er få, og deler av historien kan være legende.']]},
 {id:'xian',name:'Den store moskeen i Xi\'an',city:'Xi\'an',country:'Kina',lat:34.3,lon:108.9,built:'742 / 1300-tallet',
  fact:'Moskeen ser ut som et kinesisk tempel. Den har ingen kupler, og minareten er en pagode. Tradisjonen sier at den ble grunnlagt i 742, men det meste av dagens anlegg er fra Ming-tiden. Den arabiske kalligrafien er skrevet med kinesisk pensel.',
  people:[['Zheng He (ca. 1371–1433)','Muslimsk admiral fra Yunnan som het Ma He, og faren hans hadde vært på hajj. Mellom 1405 og 1433 ledet han sju store sjøreiser, helt til Mogadishu og Malindi i Øst-Afrika. Han tok med seg en sjiraff hjem til keiseren.']]},
 {id:'konya',name:'Alaeddin-moskeen',city:'Konya',country:'Tyrkia',lat:37.9,lon:32.5,built:'1155–1235',
  fact:'Moskeen ligger på Alaeddin-høyden midt i Konya og ble bygd i flere omganger av seldsjukkiske sultaner. Prekestolen (minbaren) av ibenholt er fra 1155 og regnes som det eldste daterte seldsjukkiske kunstverket i Anatolia.',
  people:[['Rumi (1207–1273)','Poet og lærd født i Balkh i dagens Afghanistan. Han levde og underviste i Konya i flere tiår. Hovedverket hans er Masnavi, et langt lærediktverk på persisk.'],['Gürcü Hatun','Hustru til en seldsjukkisk vesir i Konya, og en av Rumis nære venner og støttespillere.']]},
 {id:'mazar',name:'Mazar-e-Quaid',city:'Karachi',country:'Pakistan',lat:24.9,lon:67.0,built:'1960–1970',
  fact:'Mausoleet i hvit marmor ligger midt i Karachi og er byens kjennetegn. Inne henger en krystallysekrone i fire etasjer, en gave fra Kina. Jinnah-lua kommer fra Bukhara: den er laget av pelsen til karakul-sau, og «karakul» betyr «svart pels» på usbekisk.',
  people:[['Muhammad Ali Jinnah (1876–1948)','Advokat fra Karachi, utdannet i London, og leder for Den muslimske liga. Først arbeidet han for samhold mellom hinduer og muslimer mot britisk styre, men han ble overbevist om at muslimene trengte et eget land for å sikre rettighetene sine. Han ledet kravet om Pakistan, og da Britisk India ble delt, ble Pakistan selvstendig 14. august 1947. Han ble landets første generalguvernør, men døde året etter. Han kalles Quaid-e-Azam, «den store lederen». Lua hans av karakulpels er så knyttet til ham at den kalles Jinnah-lua.'],['Fatima Jinnah (1893–1967)','Søsteren hans. Hun ble den første kvinnelige tannlegen i Britisk India og senere opposisjonsleder i Pakistan. Hun ble kalt Madar-e-Millat, «nasjonens mor». Det var også hun som valgte arkitekten Yahya Merchant, og hun er selv gravlagt i mausoleet.']]},
 {id:'liverpool',name:'Abdullah Quilliams moské',city:'Liverpool',country:'Storbritannia',lat:53.41,lon:-2.98,built:'1889',
  fact:'Liverpool Muslim Institute åpnet første juledag 1889 i et rekkehus i Brougham Terrace 8. Den regnes som den første moskeen i drift i Storbritannia. I dag holder Abdullah Quilliam Society på å sette huset i stand igjen.',
  people:[['Abdullah Quilliam (1856–1932)','Advokat fra Liverpool som ble muslim i 1887 etter en reise til Marokko. Rundt 600 mennesker ble muslimer gjennom arbeidet hans, og den osmanske sultanen ga ham tittelen shaykh al-islam for De britiske øyer.'],['Fatima Cates (1865–1900)','En av de første kvinnene i Storbritannia som ble muslim, i 1887. Hun var med på å grunnlegge moskeen og ble den første kassereren. Hun skrev om islam til aviser og tidsskrifter, og tålte steinkast for troen sin.']]},
 {id:'kauman',name:'Masjid Gedhe Kauman',city:'Yogyakarta',country:'Indonesia',lat:-7.8,lon:110.4,built:'1773',
  fact:'Sultanens storemoské i Yogyakarta, bygd av Hamengkubuwono I. Den er i javanesisk stil med tak i flere etasjer, uten kuppel og uten minaret. Den ligger ved det store torget foran sultanens palass, slik den javanesiske tradisjonen samler moské, styre og marked.',
  people:[['Siti Walidah (1872–1946)','Kjent som Nyai Ahmad Dahlan, født i Kauman-kvarteret ved moskeen. Sammen med mannen tok hun initiativ til kvinneorganisasjonen Aisyiyah i 1917. Gjennom den startet hun skoler og internater for jenter og lese- og koranundervisning for kvinner, og hun talte mot tvangsekteskap. Hun er nasjonalhelt i Indonesia.'],['Ahmad Dahlan (1868–1923)','Mannen hennes, som i 1912 grunnla Muhammadiyah i Kauman, en av Indonesias største muslimske organisasjoner.']]},
 {id:'barawa',name:'Barawa gamleby',city:'Barawa',country:'Somalia',lat:1.1,lon:44.0,built:'Middelalderen og senere',
  fact:'Barawa (Brava) er en gammel havneby sør i Somalia med sitt eget språk, chimiini. Husene i gamlebyen er bygd av stein, tett i tett langs smale gater ned mot havet.',
  people:[['Dada Masiti (ca. 1810–1919)','Poet, mystiker og lærd. Ifølge muntlig tradisjon ble hun bortført som barn og ført til Zanzibar, men kom hjem igjen og viet livet til studier. Diktene hennes på chimiini ble lært utenat, særlig av kvinner, og hjalp mange kvinner i Barawa til høy religiøs lærdom. Hvor hun ble født, er omstridt: Barawa eller Tunda på Pate.']]},
 {id:'lamu',name:'Lamu gamleby',city:'Lamu',country:'Kenya',lat:-2.3,lon:40.9,built:'1300-tallet og senere',
  fact:'UNESCO kaller Lamu den eldste og best bevarte swahilibyen i Øst-Afrika. Husene er bygd av korallstein og mangrovetre, og gatene er så smale at det ikke går biler der. Folk og varer fraktes med esler.',
  people:[['Mwana Kupona (d. ca. 1865)','Poet født på øya Pate. Rundt 1858 skrev hun et langt dikt med livsråd til datteren Mwana Heshima, «Utendi wa Mwana Kupona», et av de mest kjente verkene i tidlig swahililitteratur. Huset hennes i Lamu gamleby står fortsatt.']]},
 {id:'kobe',name:'Kobe-moskeen',city:'Kobe',country:'Japan',lat:34.7,lon:135.2,built:'1935',
  fact:'Japans første moské, tegnet av den tsjekkiske arkitekten Jan Josef Švagr i indo-islamsk stil. Den ble betalt med innsamlede gaver fra 1928 og åpnet i 1935. Den overlevde bombingen av Kobe i 1945, da det meste rundt ble ødelagt, og jordskjelvet i 1995. Etter skjelvet ga den ly til folk som hadde mistet hjemmene sine, og den kalles «mirakelmoskeen».',
  people:[['Umar Ryoichi Mita (1892–1983)','Født i Yamaguchi og ble muslim i 1941. Han var den første muslimen som oversatte Koranen til japansk, et arbeid han brukte rundt tolv år på før det kom ut i 1972. Han unngikk ord med buddhistisk klang og valgte enkle japanske ord.'],['Omar Yamaoka','Den første japaneren som dro på hajj, i 1909. Etter at han kom hjem, reiste han rundt i Japan og fortalte om islam.']]}
);

  ${dots}<button class="btn" id="riNext">Slik fortsetter reisen</button>`);

 wazir:[['Hakim Ilm-ud-din Ansari («Wazir Khan»)','Født i Chiniot i Punjab. Han utdannet seg som lege, og ble lege ved hoffet til stormogulen Shah Jahan. Senere ble han guvernør i Lahore og brukte formuen sin på moskeen, en karavanserai, bad og en basar rundt den. Inntektene fra butikkene skulle holde moskeen i drift, slik waqf-stiftelser gjorde.']],
 taj:[['Jahanara Begum (1614–1681)','Eldste datter av Shah Jahan og Mumtaz Mahal. Etter morens død ble hun den mektigste kvinnen ved hoffet. Hun skrev to sufi-verk, drev egen handel med skip og bekostet den store Jama-moskeen i Agra, fullført i 1648. Hun ba om å bli gravlagt under åpen himmel med bare gress over graven.']],
 djenne:[['Ahmad Baba (1556–1627), Timbuktu','En av Timbuktus største lærde, med over 40 bøker om fiqh, grammatikk og biografier over lærde. Da Marokko erobret byen i 1591, ble han ført til Marrakech. Der underviste han til han fikk reise hjem. Han sa selv at hans bibliotek på 1600 bind var blant de minste i familien.'],['Mansa Musa (død ca. 1337)','Kongen av Mali dro på hajj i 1324 med en enorm karavane og delte ut så mye gull i Kairo at prisen falt i årevis. Han tok med seg lærde og byggmestere hjem og gjorde Timbuktu til en lærdomsby.']],
 sarajevo:[['Gazi Husrev-beg (1480–1541)','Osmansk guvernør i Bosnia og barnebarn av en sultan. Han bygde moskeen, en madrasa, et bibliotek, et bad og en suppekjøkken for de fattige rundt den, alt finansiert av en waqf som fortsatt eksisterer. Han ba om murere fra Dubrovnik til arbeidet.'],['Umihana Čuvidina (ca. 1794–ca. 1870)','Poet fra Sarajevo, regnet som den tidligste bosniske kvinnelige forfatteren med verk som er bevart. Hun skrev med arebica, bosnisk med arabiske bokstaver, og satte spor i sevdalinka, den bosniske folkesangen.']],
 kilwa:[['Sultan al-Hasan ibn Sulaiman (1300-tallet)','Kilwas sultan da byen var på sitt rikeste. Han bygde ut den store moskeen og palasset Husuni Kubwa. Ibn Baṭṭūṭa besøkte ham i 1331, kalte Kilwa en av de vakreste byene i verden og fortalte at sultanen ga raust til de fattige.'],['Ibn Baṭṭūṭa','Den reisende fra Tanger kom hit i 1331.','battuta']],
 blue:[['Sedefkâr Mehmed Ağa','Arkitekten bak moskeen, elev av den store Mimar Sinan. Han begynte som musiker, ble så mester i perlemorarbeid, derav tilnavnet «Sedefkâr», og til slutt sjefsarkitekt for sultanen. Det var han som valgte de over 20 000 blå iznik-flisene.'],['Kösem Sultan (ca. 1589–1651)','Hustru til sultan Ahmed I, som moskeen er oppkalt etter. Hun ble en av de mektigste kvinnene i osmansk historie og lot bygge Çinili-moskeen i Üsküdar.']],
 kruszyniany:[['Lipka-tatarene','Sunnimuslimske tatarer som slo seg ned i storfyrstedømmet Litauen fra 1300-tallet og kjempet for kongen. Kong Jan III Sobieski ga dem land her som takk for tjenesten. De glemte etter hvert tatarisk og snakker polsk, men har holdt på troen i over 600 år, med egne moskeer av tre og en gravplass, mizar, ved siden av.']],
 bibi:[['Imam al-Bukhari (810–870)','Født i Bukhara. Han reiste i 16 år for å samle hadith og valgte ut rundt 7 000 av flere hundre tusen han hadde hørt. Før han skrev ned en hadith, ba han to rakʻa. Samlingen Sahih al-Bukhari regnes av sunnimuslimer som den sikreste boka etter Koranen.'],['Saray Mulk Khanum («Bibi-Khanym»)','Timurs hovedhustru og en mongolsk prinsesse. Ifølge historien fulgte hun selv byggingen mens Timur var på felttog i India. Moskeen, en av de største i verden på sin tid, fikk navnet hennes.']],
 sixty:[['Khan Jahan Ali (død 1459)','Lærd og guvernør som ryddet jungelen i Sundarbans og grunnla byen Khalifatabad, dagens Bagerhat. Han bygde veier, broer, dammer med drikkevann og over 50 moskeer, blant dem Seksti kuplers moské. Mange i Bengal kom til islam gjennom slike lærde og nybyggere.'],['Begum Rokeya (1880–1932)','Født i Rangpur i dagens Bangladesh. Hun lærte seg å lese i hemmelighet om natten, skrev science fiction-fortellingen «Sultana\'s Dream» og startet i 1911 en skole for jenter i Kolkata.']],
 qarawiyyin:[['Fatima al-Fihri','Hun brukte arven etter faren til å grunnlegge al-Qarawiyyin og fulgte selv med på byggingen. Ifølge tradisjonen fastet hun mens arbeidet pågikk.','fihri'],['Mariam al-Fihri','Søsteren til Fatima. Rundt samme tid grunnla hun al-Andalusiyyin-moskeen på den andre siden av elven i Fès, for familiene som hadde kommet fra al-Andalus.']],
 sokoto:null,
 mustansiriya:[['Ahmad ibn Hanbal (780–855)','Født og gravlagt i Bagdad, grunnlegger av den hanbalittiske lovskolen og samler av Musnad med rundt 30 000 hadith. Da kalifen krevde at de lærde skulle si at Koranen var skapt, nektet han, ble pisket og fengslet, men ga seg ikke. Folk i hele Bagdad fulgte ham til graven.'],['Sutayta al-Mahamali (900-tallet)','Lærd fra Bagdad, datter av en kjent dommer. Hun var jurist og mufti og var kjent for regning og arveberegning. Senere historikere roste kunnskapen hennes.'],['Zubaida (død 831)','Hustru til kalifen Harun al-Rashid. Hun bekostet brønner, vannbassenger og rasteplasser langs pilegrimsveien fra Irak til Mekka, som fikk navnet Darb Zubaida etter henne.'],['al-Khwārizmī','Arbeidet i det første Visdommens hus her i Bagdad.','khwarizmi']],
 cordoba:[['ʻAbd al-Raḥmān I (731–788)','Den eneste i umayyade-familien som overlevde da abbasidene tok makten i 761. Han flyktet fra Syria til al-Andalus, grunnla emiratet i Córdoba og begynte byggingen av moskeen i 785. Han skrev et dikt om en palme som, som ham selv, var langt hjemmefra.'],['Imam al-Qurṭubī (død 1273)','Født i Córdoba. Han skrev en av de mest brukte tafsirene, al-Jāmiʿ li-aḥkām al-Qurʼān, som fortsatt leses. Han flyttet til Egypt etter at Córdoba falt i 1236.'],['al-Zahrāwī','Kirurg ved hoffet i Córdoba.','zahrawi'],['Lubnā fra Córdoba','Sekretær og lærd ved kalifens bibliotek.','lubna'],['Ibn Rushd','Dommer, lege og filosof fra Córdoba.','rushd']],
 kalyan:[['Arslan Khan Muhammad (1100-tallet)','Karakhanidisk hersker som bygde minareten i 1127. Den var så vakker at Djengis Khan, ifølge fortellingen, sparte den da han brant resten av byen i 1220.'],['Bahāʼ al-Dīn Naqshband (1318–1389)','Lærd fra området rundt Bukhara som ga navn til naqshbandi-tariqaen. Han lærte at man skal ha «hånden i arbeidet og hjertet hos Gud». Han skulle bruke dagen nyttig og huske Allah samtidig, litt som når du steller hagen mens verset spiller.'],['Ibn Sīnā','Lege og filosof, født like ved Bukhara.','sina']],
 azhar:[['Ibn Ḥajar al-ʻAsqalānī (1372–1449)','Hadith-lærd og dommer i Kairo. Han brukte rundt 25 år på Fatḥ al-Bārī, den mest kjente kommentaren til Sahih al-Bukhari, og underviste ved al-Azhar.'],['Jalāl al-Dīn al-Suyūṭī (1445–1505)','En av de mest produktive lærde i historien, med flere hundre verk. Han fullførte tafsiren Tafsīr al-Jalālayn, som læreren hans hadde begynt på, og som fortsatt er en av de mest brukte korte tafsirene.'],['Ibn al-Haytham','Gjorde det meste av arbeidet sitt med lys og syn her i Kairo.','haytham']],
 umayyad:[['Umm al-Darda den yngre (600-tallet)','Lærd i hadith og fiqh som underviste i moskeene i Damaskus og Jerusalem, også menn. En av de faste elevene hennes var kalifen Abd al-Malik.'],['Imam al-Nawawī (1233–1277)','Underviste i Damaskus og skrev Riyāḍ al-Ṣāliḥīn og De 40 hadithene, som lærere og elever over hele verden bruker i dag. Han levde enkelt, spiste lite og brukte nesten all tid på studier. Han døde bare 44 år gammel.'],['Al-Ghazali (1058–1111)','Lærd kalt Hujjat al-Islam, «Islams bevis». Han forlot den berømte lærestillingen sin i Bagdad og levde i tilbaketrekning i Damaskus. Ifølge tradisjonen feide han gulvene i Umayyade-moskeen uten at noen visste hvem han var. Det var i disse årene han skrev Ihya ulum al-din.'],['Ibn al-Bayṭār','Farmasøyt og botaniker som døde i Damaskus.','baytar']],
 firdaws:[['Dayfa Khatun (død 1242)','Kurdisk prinsesse, niese av Salah al-Din, som styrte Aleppo som regent fra 1236 til 1242, mens barnebarnet var for ungt. Hun bygde både Paradisskolen og et sufisenter og støttet lærde. Det er sjelden i historien at en kvinne både styrte en by og bygde et lærested.'],['al-ʻIjliyya','Lagde astrolaber for emiren av Aleppo.','ijliyya']],
 konya:[['Rumi (1207–1273)','Poet og lærd født i Balkh i dagens Afghanistan. Familien flyktet fra mongolene og slo seg ned i Konya, der han underviste i fiqh i mange år før han ble poet. Hovedverket hans er Masnavi, et langt lærediktverk på persisk, som begynner med en ney-fløyte som lengter hjem.'],['Gürcü Hatun','Georgisk prinsesse som ble muslim og giftet seg med seldsjukksultanen. Hun var en av Rumis nære venner og støttespillere, og ifølge fortellingen lot hun et portrett av ham male i hemmelighet for å ha det med på reiser.']],
 kauman:[['Siti Walidah (1872–1946)','Kjent som Nyai Ahmad Dahlan, født i Kauman-kvarteret ved moskeen. Sammen med mannen tok hun initiativ til kvinneorganisasjonen Aisyiyah i 1917. Gjennom den startet hun skoler og internater for jenter og lese- og koranundervisning for kvinner, og hun talte mot tvangsekteskap. Hun er nasjonalhelt i Indonesia.'],['Ahmad Dahlan (1868–1923)','Mannen hennes. Han var imam i Kauman-moskeen, studerte i Mekka og grunnla i 1912 Muhammadiyah, en av Indonesias største muslimske organisasjoner, med tusenvis av skoler og sykehus i dag.']],
 kobe:[['Umar Ryoichi Mita (1892–1983)','Født i Yamaguchi og ble muslim i 1941. Han var den første muslimen som oversatte Koranen til japansk, et arbeid han brukte rundt tolv år på før det kom ut i 1972. Han unngikk ord med buddhistisk klang og valgte enkle japanske ord.'],['Omar Yamaoka (1880–1959)','Den første japaneren som dro på hajj, i 1909. Han reiste via Istanbul og ble kjent med muslimer fra mange land. Etter at han kom hjem, reiste han rundt i Japan og fortalte om islam.']]

const BPRI=['Snakk med','Vann knoppen','En rose henger','Lampen hans','Hærfuglen','Noe glimter her','Reparer','Vann fra elven','Gi fiskene mat','Trykk for å høste','Så et frø','Trykk for å samle','Gi mat','Rydd','skadet','Trykk for'];

let _bq=null;
function bqStart(){ _bq=R2?[]:null; }
function bqEnd(){ const L=(_bq||[]).filter(x=>!/^Rydd|Rydd /.test(x.l||'')); _bq=null; if(!L||!L.length) return ''; const info=L.filter(x=>BINFO.some(k=>(x.l||'').startsWith(k))), acts=L.filter(x=>!info.includes(x));
  const pri=x=>{ const i=BPRI.findIndex(k=>(x.l||'').includes(k)); return i<0?BPRI.length:i; };
  const shown=[]; if(acts.length){ acts.sort((a,b)=>pri(a)-pri(b)); shown.push(acts[0]); }
  info.forEach(x=>{ if(!shown.some(y=>Math.hypot(y.x-x.x,y.y-x.y)<80)) shown.push(x); });
  return shown.map(x=>x.h).join(''); }

async function openHifz(){ if(R2) return towerInfo();

  if(!cur){
    openSheet(`<h3>Lysets tårn</h3><p>Velg en surah å lære utenat. Hvert vers tenner et vindu i tårnet, nedenfra og opp. Vinduene ber om repetisjon til riktig tid: etter 1 dag, så 3, 7, 21 og 45 dager. Når et vindu dempes, er det tid for å repetere det. Når hele surahen er lært, tennes lykten på toppen.</p><div class="card list" id="hzS">${surahMeta?'':'<p>Får ikke hentet listen. Sjekk nettet.</p>'}</div><h4>Alle surahs</h4><div class="card list" id="hzA"></div>`);

    $('hzS').innerHTML=SUGGEST.map(n=>item(surahMeta[n-1])).join(''); $('hzA').innerHTML=surahMeta.map(item).join('');
    $('sheet').querySelectorAll('.list button').forEach(b=>b.onclick=()=>{ S.hifz.current=+b.dataset.s; if(!S.seenRest.taarn){ S.seenRest.taarn=true; logEvent('Lysets tårn er reist igjen.'); } save(); openHifz(); renderAll(); });
    return;
  }
  const meta=surahMeta?surahMeta[cur-1]:{englishName:'Surah '+cur,numberOfAyahs:7};
  const pr=S.hifz.prog[cur]||{}, N=meta.numberOfAyahs, lit=Object.values(pr).filter(l=>l>=1).length, all=lit===N;

  openSheet(`<h3>${esc(meta.englishName)}</h3><p>${lit} av ${N} vinduer tent${all?' · lykten på toppen lyser':''}. Trykk på det blinkende vinduet for å fortsette. Hver leksjon er en vanlig 10-minutters økt med akkurat det verset.</p><div class="tower"><div class="crown ${all?'lit':''}"></div>${w}</div><button class="btn ghost" id="hzChg">Bytt surah</button>`);

const shortLimit=()=>S.settings.shortPerDay??3;
const shortToday=()=>(S.shortDone&&S.shortDone.day===dayStr())?S.shortDone.n:0;
function genShortTimes(n){ const out=[], lo=8*60+30, hi=21*60+30; let tries=0;
  while(out.length<n&&tries<500){ tries++; const t=lo+Math.floor(Math.random()*(hi-lo)); if(out.every(o=>Math.abs(o-t)>=100)) out.push(t); }
  return out.sort((a,b)=>a-b).map(t=>`${String(Math.floor(t/60)).padStart(2,'0')}:${String(t%60).padStart(2,'0')}`); }
function weekKey(){ const d=new Date(); const j=new Date(d.getFullYear(),0,1); return d.getFullYear()+'-'+Math.ceil(((d-j)/864e5+j.getDay()+1)/7); }
function shortTimes(){ const n=shortLimit(); if(!S.shortTimes||S.shortTimes.week!==weekKey()||S.shortTimes.t.length!==n){ S.shortTimes={week:weekKey(),t:genShortTimes(n)}; save(); } return S.shortTimes.t; }
function shortHTML(){ const n=shortLimit(), T=n?shortTimes():[];
  return `<h4>Korte økter per dag</h4><div class="seg" id="shSeg">${[0,1,2,3,4,5].map(k=>`<button data-n="${k}" class="${n===k?'on':''}">${k}</button>`).join('')}</div>

function enoughToday(){ openSheet(`<h3 style="text-align:center">Du har gjort nok i dag</h3><div style="text-align:center;font-size:44px">🌙</div><p style="text-align:center">Du har tatt ${shortToday()} korte økter i dag, slik du bestemte. ${doneToday()?'Hagen har fått det den trenger. Du kan lukke appen med god samvittighet.':'Du kan lukke appen med god samvittighet. Husk bare dagens hovedøkt når det passer, det er den som gjenoppretter hagen.'}</p><button class="btn" id="enClose">Lukk</button><button class="btn ghost" id="enMore">Ta en økt likevel</button>`);

function backupNudge(){ if(!S.introSeen||S.active||busy||(typeof sess!=='undefined'&&sess)||(S.vs||0)<3) return false; const last=S.lastBackup||S.firstBackupNudge||0, wk=7*864e5;
  if(!S.firstBackupNudge&&!S.lastBackup){ S.firstBackupNudge=Date.now()-wk; }
  if(Date.now()-last<wk||S.backupNudgeDay===dayStr()||$('sheet').classList.contains('on')) return false;
  S.backupNudgeDay=dayStr(); save();
